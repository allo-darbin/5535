<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 5535 Live Tracker</title>
    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: white; padding: 12px 18px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-width: 260px;
        }
        .info-box h3 { margin: 0 0 5px 0; font-size: 16px; color: #1a73e8; }
        .info-box p { margin: 3px 0; font-size: 13px; color: #444; }
    </style>
</head>
<body>

    <!-- Floating Info Panel -->
    <div class="info-box">
        <h3 id="team-name">Team 5535: Connecting...</h3>
        <p id="team-status">Polling local relay every 30s...</p>
        <p id="team-coords">Coordinates: --</p>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Omnivore CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    
    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([56.122, -3.910], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker = null;

        // 2. Load the KML route file from your repository
        const routeLayer = omnivore.kml('route.kml')
            .on('ready', function() {
                this.setStyle({ color: '#2094f3', weight: 5, opacity: 0.8 });
                map.fitBounds(this.getBounds());
            })
            .addTo(map);

        // 3. Load Official Checkpoints from checkpoints-p26.json
        async function loadCheckpoints() {
            try {
                const response = await fetch('checkpoints-p26.json');
                if (!response.ok) throw new Error('Failed to load checkpoints');
                const json = await response.json();
                
                if (json.success && Array.isArray(json.data)) {
                    json.data.forEach(cp => {
                        L.circleMarker([cp.la, cp.lo], {
                            radius: 6,
                            color: cp.c || '#f44034',
                            fillColor: cp.c || '#f44034',
                            fillOpacity: 0.8
                        })
                        .addTo(map)
                        .bindTooltip(`<b>${cp.n}</b>`, { permanent: true, direction: 'top', offset: [0, -5] });
                    });
                }
            } catch (error) {
                console.error("Error loading checkpoints:", error);
            }
        }

        // 4. Load Manual Cheerpoints from cheerpoints.json
        async function loadCheerpoints() {
            try {
                const response = await fetch('cheerpoints.json?t=' + new Date().getTime());
                if (!response.ok) return; // Optional file, ignore if missing
                const json = await response.json();
                
                if (json.success && Array.isArray(json.data)) {
                    json.data.forEach(cp => {
                        L.circleMarker([cp.lat, cp.lon], {
                            radius: 7,
                            color: '#9c27b0', // Purple color for cheer spots
                            fillColor: '#ba68c8',
                            fillOpacity: 0.9
                        })
                        .addTo(map)
                        .bindPopup(`<b> ${cp.name}</b><br>${cp.note || ''}`)
                        .bindTooltip(` ${cp.name}`, { permanent: true, direction: 'bottom', offset: [0, 5] });
                    });
                }
            } catch (error) {
                console.log("No cheerpoints.json found or invalid format yet.");
            }
        }

        loadCheckpoints();
        loadCheerpoints();

        // 5. Function to fetch local JSON relay file updated by your laptop script every 30 seconds
        async function updateTracker() {
            try {
                const response = await fetch('team5535_live.json?t=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const json = await response.json();
                let teamData = null;

                if (json && json.success && json.data) {
                    teamData = json.data;
                } else if (json && json.ll) {
                    teamData = json;
                }

                if (teamData && teamData.ll) {
                    const [lat, lon] = teamData.ll.split(',').map(Number);
                    const teamName = teamData.n || 'Team 5535';

                    document.getElementById('team-name').innerText = `${teamName} (#${teamData.r || 5535})`;
                    document.getElementById('team-coords').innerText = `Lat/Lon: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

                    if (marker) {
                        marker.setLatLng([lat, lon]);
                    } else {
                        marker = L.marker([lat, lon]).addTo(map);
                    }
                } else {
                    document.getElementById('team-status').innerText = "Waiting for valid coordinate data...";
                }
            } catch (error) {
                console.error("Error reading local relay file:", error);
                document.getElementById('team-status').innerText = "Waiting for initial laptop sync...";
            }
        }

        updateTracker();
        setInterval(updateTracker, 30000);
    </script>
</body>
</html>
