<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 5535 Live Tracker</title>
    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: white; padding: 12px 18px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-width: 260px;
        }
        .info-box h3 { margin: 0 0 5px 0; font-size: 16px; color: #1a73e8; }
        .info-box p { margin: 3px 0; font-size: 13px; color: #444; }
    </style>
</head>
<body>

    <!-- Floating Info Panel -->
    <div class="info-box">
        <h3 id="team-name">Team 5535: Connecting...</h3>
        <p id="team-status">Fetching race data...</p>
        <p id="team-coords">Coordinates: --</p>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Initialize Map centered around Stirling / Bannockburn area
        const map = L.map('map').setView([56.122, -3.910], 13);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker = null;
        let routeLine = null;

        // Sample route coordinates extracted from the KML file
        const routeCoords = [
            [56.12233, -3.91031], [56.12187, -3.91035], [56.12134, -3.91019],
            [56.12124, -3.91001], [56.11898, -3.90988], [56.11822, -3.91122],
            [56.11759, -3.91097], [56.11732, -3.91133], [56.11702, -3.91090],
            [56.11677, -3.91100], [56.11655, -3.91149], [56.11642, -3.91242],
            [56.11623, -3.91266], [56.11204, -3.91505], [56.11174, -3.91336]
        ];

        // Draw the static route polyline on the map
        routeLine = L.polyline(routeCoords, { color: '#2094f3', weight: 5, opacity: 0.8 }).addTo(map);

        // 2. Function to fetch JSON and update team 5535's position
        async function updateTracker() {
            try {
                // Route through a public CORS proxy to allow fetching external tracking data from GitHub Pages
                const targetUrl = 'https://live.opentracking.co.uk/26ww50km/data/teams-p26.json';
                const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
                
                const response = await fetch(proxyUrl);
                const json = await response.json();

                if (json.success && json.data) {
                    let foundTeam = null;
                    
                    // Search through the category groups to locate competitor 5535
                    json.data.forEach(group => {
                        group.teams.forEach(team => {
                            if (team.r === 5535) {
                                foundTeam = team;
                            }
                        });
                    });

                    if (foundTeam) {
                        // Extract latitude and longitude from the "ll" key
                        const [lat, lon] = foundTeam.ll.split(',').map(Number);

                        // Update the text box overlay
                        document.getElementById('team-name').innerText = `${foundTeam.n} (#${foundTeam.r})`;
                        document.getElementById('team-status').innerText = `Group: ${foundTeam.g} (${foundTeam.tg})`;
                        document.getElementById('team-coords').innerText = `Lat/Lon: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

                        // Update or initialize the map marker pin
                        if (marker) {
                            marker.setLatLng([lat, lon]);
                        } else {
                            marker = L.marker([lat, lon]).addTo(map)
                                .bindPopup(`<b>${foundTeam.n}</b><br>Team 5535 Active Marker`)
                                .openPopup();
                            map.setView([lat, lon], 14); // Center map on runner on first load
                        }
                    } else {
                        document.getElementById('team-status').innerText = "Team 5535 not found in feed.";
                    }
                }
            } catch (error) {
                console.error("Error fetching live tracking data:", error);
                document.getElementById('team-status').innerText = "Connection error. Retrying...";
            }
        }

        // Run immediately on page load
        updateTracker();

        // Refresh data every 30 seconds
        setInterval(updateTracker, 30000);
    </script>
</body>
</html>
