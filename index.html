<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 5535 Live Tracker</title>
    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: white; padding: 12px 18px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-width: 260px;
        }
        .info-box h3 { margin: 0 0 5px 0; font-size: 16px; color: #1a73e8; }
        .info-box p { margin: 3px 0; font-size: 13px; color: #444; }
    </style>
</head>
<body>

    <!-- Floating Info Panel -->
    <div class="info-box">
        <h3 id="team-name">Team 5535: Loading...</h3>
        <p id="team-status">Connecting to tracking feed...</p>
        <p id="team-coords">Coordinates: --</p>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Omnivore CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    
    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([56.122, -3.910], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker = null;

        // 2. Load the KML route file from your repository
        const routeLayer = omnivore.kml('route.kml')
            .on('ready', function() {
                this.setStyle({ color: '#2094f3', weight: 5, opacity: 0.8 });
                map.fitBounds(this.getBounds());
            })
            .addTo(map);

        // 3. Function to fetch JSON using AllOrigins proxy and update team 5535
        async function updateTracker() {
            try {
                const targetUrl = 'https://live.opentracking.co.uk/26ww50km/data/teams-p26.json';
                // Using AllOrigins wrapper to successfully bypass CORS restrictions
                const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);
                
                const response = await fetch(proxyUrl);
                const wrapper = await response.json();
                
                if (wrapper && wrapper.contents) {
                    const json = JSON.parse(wrapper.contents);

                    if (json && json.data) {
                        let foundTeam = null;
                        
                        json.data.forEach(group => {
                            if (group.teams) {
                                group.teams.forEach(team => {
                                    if (team.r === 5535 || team.r === "5535") {
                                        foundTeam = team;
                                    }
                                });
                            }
                        });

                        if (foundTeam && foundTeam.ll) {
                            console.log("Found Team 5535:", foundTeam);
                            const [lat, lon] = foundTeam.ll.split(',').map(Number);

                            document.getElementById('team-name').innerText = `${foundTeam.n} (#${foundTeam.r})`;
                            document.getElementById('team-status').innerText = `Status: Active`;
                            document.getElementById('team-coords').innerText = `Lat/Lon: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

                            if (marker) {
                                marker.setLatLng([lat, lon]);
                            } else {
                                marker = L.marker([lat, lon]).addTo(map)
                                    .bindPopup(`<b>${foundTeam.n}</b><br>Team 5535`)
                                    .openPopup();
                            }
                        } else {
                            document.getElementById('team-status').innerText = "Team 5535 location pending";
                        }
                    }
                }
            } catch (error) {
                console.error("Error fetching live tracking data:", error);
                document.getElementById('team-status').innerText = "Connection error. Retrying...";
            }
        }

        // Run immediately and poll every 30 seconds
        updateTracker();
        setInterval(updateTracker, 30000);
    </script>
</body>
</html>
