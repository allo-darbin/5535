<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 5535 Live Tracker</title>

    <!-- Inline Runner Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃</text></svg>">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100vw;
        }

        .info-box {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            max-width: 290px;
            font-size: 13px;
        }

        .info-box p {
            margin: 6px 0 0;
            color: #444;
        }

        /* Time offset input styling sized for ~4 digits with clear spacing */
        .offset-input {
            width: 38px;
            padding: 3px 4px;
            font-size: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            outline: none;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        /* Light Yellow for positive offsets */
        .offset-input.offset-pos {
            background-color: #fffde7;
            color: #f57f17;
            border-color: #fff59d;
        }

        /* Light Green for negative offsets */
        .offset-input.offset-neg {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-color: #c8e6c9;
        }

        /* Prevent layer control from overlapping zoom +/- buttons */
        .leaflet-top.leaflet-left .leaflet-control-layers {
            margin-top: 10px;
        }

        /* Existing status box in bottom-left corner */
        .status-overlay {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #333;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            pointer-events: none;
            line-height: 1.4;
        }

        .leaflet-popup-content a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }

        .leaflet-popup-content a:hover {
            text-decoration: underline;
        }

        .racer-icon {
            font-size: 30px;
            line-height: 36px;
            text-align: center;
            filter: drop-shadow(1px 2px 2px #555);
        }
    </style>
</head>

<body>
    <div class="info-box">
        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #666; gap: 12px;">
            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                <input type="checkbox" id="toggle-labels" onchange="toggleLabels()">
                Show Labels
            </label>
            <label for="timeOffset" style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
                Offset:
                <input type="number" id="timeOffset" value="0" oninput="applyTimeOffset()" class="offset-input">
            </label>
        </div>
    </div>

    <!-- Existing bottom-left timestamp container -->
    <div id="last-update" class="status-overlay">Tracking active...</div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    <!-- Turf.js for route distance calculations -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        // Dynamic background styling for offset box
        function updateOffsetStyle() {
            const input = document.getElementById('timeOffset');
            if (!input) return;
            const val = parseInt(input.value, 10) || 0;

            input.classList.remove('offset-pos', 'offset-neg');
            if (val > 0) {
                input.classList.add('offset-pos');
            } else if (val < 0) {
                input.classList.add('offset-neg');
            }
        }

        // 1. Initialise base maps and layer switcher with persistence.
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, swisstopo, and the GIS User Community'
        });

        const savedLayerName = localStorage.getItem('selectedMapLayer');
        const initialLayer = (savedLayerName === 'Satellite View') ? satelliteLayer : osmLayer;

        const map = L.map('map', {
            center: [56.122185, -3.91031],
            zoom: 13,
            layers: [initialLayer]
        });

        const baseMaps = {
            "Street Map": osmLayer,
            "Satellite View": satelliteLayer
        };

        L.control.layers(baseMaps, null, { position: 'topleft' }).addTo(map);

        map.on('baselayerchange', function (e) {
            localStorage.setItem('selectedMapLayer', e.name);
        });

        let marker = null;
        let pointLayers = [];
        let rawPointsData = [];
        let parsedPoints = [];
        let firstPositionReceived = false;
        let cleanRouteLine = null;

        let lastKnownCoords = null;
        let mostRecentSpeedKmPerMin = 0;
        let globalRunnerTraveledKm = 0;
        let userClosedPopup = false;

        let prevLat = null;
        let prevLon = null;
        let prevTime = null;
        let lastTrackerUpdateTime = null;

        function extractLineString(geoJson) {
            try {
                let coords = [];
                turf.coordEach(geoJson, function (currentCoord) {
                    coords.push(currentCoord);
                });
                if (coords.length >= 2) {
                    return turf.lineString(coords);
                }
            } catch (err) {
                console.error("Error processing KML coordinates for Turf:", err);
            }
            return null;
        }

        omnivore.kml('route.kml')
            .on('ready', function () {
                this.setStyle({
                    color: '#2094f3',
                    weight: 5,
                    opacity: 0.8
                });

                if (!firstPositionReceived && this.getBounds().isValid()) {
                    map.fitBounds(this.getBounds());
                }

                cleanRouteLine = extractLineString(this.toGeoJSON());
            })
            .on('error', function (error) {
                console.error('Could not load route.kml:', error);
            })
            .addTo(map);

        function adjustTimeString(timeStr, offsetMinutes) {
            let hours = parseInt(timeStr.substring(0, 2), 10);
            let mins = parseInt(timeStr.substring(2, 4), 10);
            
            let totalMinutes = (hours * 60) + mins + offsetMinutes;
            totalMinutes = (totalMinutes + 1440) % 1440;
            
            let newHours = Math.floor(totalMinutes / 60).toString().padStart(2, '0');
            let newMins = (totalMinutes % 60).toString().padStart(2, '0');
            
            return newHours + newMins;
        }

        function renderPoints() {
            pointLayers.forEach(layer => map.removeLayer(layer));
            pointLayers = [];
            parsedPoints = [];

            const offsetInput = document.getElementById('timeOffset');
            const offsetMinutes = offsetInput ? (parseInt(offsetInput.value) || 0) : 0;

            rawPointsData.forEach(pt => {
                const lat = Number(pt.la);
                const lon = Number(pt.lo);

                if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                    return;
                }

                let displayName = pt.n || 'Point';
                let targetTimeStr = null;
                const match = displayName.match(/^(\d{4})(\s.*)$/);
                if (match) {
                    const originalTime = match[1];
                    const textDescription = match[2];
                    targetTimeStr = adjustTimeString(originalTime, offsetMinutes);
                    displayName = targetTimeStr + textDescription;
                }

                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                const isCheckpoint = pt.point_type === 'checkpoint';

                let etaDisplay = 'TBD';
                let schedDisplay = 'TBD';

                if (targetTimeStr) {
                    const schedHours = parseInt(targetTimeStr.substring(0, 2), 10);
                    const schedMins = parseInt(targetTimeStr.substring(2, 4), 10);
                    const now = new Date();
                    const schedTime = new Date(now);
                    schedTime.setHours(schedHours, schedMins, 0, 0);

                    const formattedSchedTime = `${targetTimeStr.substring(0, 2)}${targetTimeStr.substring(2, 4)}`;
                    schedDisplay = formattedSchedTime;

                    if (cleanRouteLine && mostRecentSpeedKmPerMin > 0.01 && globalRunnerTraveledKm > 0.1 && typeof turf !== 'undefined') {
                        try {
                            const ptPt = turf.point([lon, lat]);
                            const snappedPt = turf.nearestPointOnLine(cleanRouteLine, ptPt);
                            const coords = turf.getCoords(cleanRouteLine);
                            const startPt = turf.point(coords[0]);
                            const ptSlice = turf.lineSlice(startPt, snappedPt, cleanRouteLine);
                            const distFromStartKm = turf.length(ptSlice, { units: 'kilometers' });

                            const remainingDistKm = Math.max(0, distFromStartKm - globalRunnerTraveledKm);
                            const liveRemMins = Math.round(remainingDistKm / mostRecentSpeedKmPerMin);
                            const liveEtaDate = new Date(now.getTime() + liveRemMins * 60000);
                            const liveEtaTimeStr = liveEtaDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }).replace(':', '');

                            etaDisplay = `${liveRemMins} mins (${liveEtaTimeStr})`;
                        } catch (e) {
                            let diffMins = Math.round((schedTime - now) / 60000);
                            etaDisplay = diffMins >= 0 ? `${diffMins} mins (${formattedSchedTime})` : `${Math.abs(diffMins)} mins ago (${formattedSchedTime})`;
                        }
                    } else {
                        let diffMins = Math.round((schedTime - now) / 60000);
                        etaDisplay = diffMins >= 0 ? `${diffMins} mins (${formattedSchedTime})` : `${Math.abs(diffMins)} mins ago (${formattedSchedTime})`;
                    }
                }

                let cleanLocationName = displayName.length > 5 ? displayName.substring(5) : displayName;

                const popupHtml =
                    `<b>${cleanLocationName}</b><br>` +
                    `ETA: ${etaDisplay}<br>` +
                    `Scheduled: ${schedDisplay}<br>` +
                    `<a href="${mapsUrl}" target="_blank" rel="noopener">📍 Open in Google Maps</a>`;

                const pointMarker = L.circleMarker([lat, lon], {
                    radius: isCheckpoint ? 12 : 10,
                    weight: 2,
                    color: pt.c || (isCheckpoint ? '#d32f2f' : '#7b1fa2'),
                    fillColor: pt.c || (isCheckpoint ? '#f44034' : '#ba68c8'),
                    fillOpacity: isCheckpoint ? 0.9 : 0.85
                })
                .addTo(map)
                .bindPopup(popupHtml)
                .bindTooltip(
                    `<b>${displayName}</b>`,
                    {
                        permanent: true,
                        direction: isCheckpoint ? 'top' : 'bottom',
                        offset: isCheckpoint ? [0, -8] : [0, 8]
                    }
                );

                pointLayers.push(pointMarker);
                parsedPoints.push({ lat, lon, name: cleanLocationName, timeStr: targetTimeStr, type: pt.point_type });
            });
        }

        function applyTimeOffset() {
            const offsetInput = document.getElementById('timeOffset');
            const offsetMinutes = offsetInput ? (parseInt(offsetInput.value) || 0) : 0;
            
            localStorage.setItem('checkpointTimeOffset', offsetMinutes);

            updateOffsetStyle();
            renderPoints();
            toggleLabels();

            if (marker) updateTracker();
        }

        async function loadPoints() {
            try {
                const response = await fetch('points.json?t=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();

                if (json.success && Array.isArray(json.data)) {
                    rawPointsData = json.data;
                    
                    const savedOffset = localStorage.getItem('checkpointTimeOffset');
                    if (savedOffset !== null) {
                        const input = document.getElementById('timeOffset');
                        if (input) input.value = savedOffset;
                    }

                    updateOffsetStyle();
                    renderPoints();
                    toggleLabels();
                }
            } catch (error) {
                console.error('Error loading points:', error);
            }
        }

        function toggleLabels() {
            const checkbox = document.getElementById('toggle-labels');
            if (!checkbox) return;
            const show = checkbox.checked;
            pointLayers.forEach(layer => {
                if (show) layer.openTooltip();
                else layer.closeTooltip();
            });
        }

        async function updateTracker() {
            try {
                const response = await fetch('team5535_live.json?t=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();

                if (!json || json.success !== true || !json.data || typeof json.data.ll !== 'string') {
                    throw new Error('Unexpected tracking JSON structure');
                }

                const rawLl = json.data.ll;
                const parts = rawLl.split(',').map(Number);
                if (parts.length !== 2 || !Number.isFinite(parts[0]) || !Number.isFinite(parts[1])) {
                    throw new Error('Invalid coordinates');
                }

                const lat = parts[0];
                const lon = parts[1];
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                const now = new Date();

                const coordsChanged = (rawLl !== lastKnownCoords);
                if (coordsChanged) {
                    if (prevLat !== null && prevLon !== null && prevTime !== null) {
                        const timeDeltaMins = (now - prevTime) / 60000;
                        if (timeDeltaMins > 0) {
                            const pt1 = turf.point([prevLon, prevLat]);
                            const pt2 = turf.point([lon, lat]);
                            const segmentDistKm = turf.distance(pt1, pt2, { units: 'kilometers' });
                            
                            if (segmentDistKm > 0.005) {
                                mostRecentSpeedKmPerMin = segmentDistKm / timeDeltaMins;
                            }
                        }
                    }

                    prevLat = lat;
                    prevLon = lon;
                    prevTime = now;
                    lastTrackerUpdateTime = now;
                    lastKnownCoords = rawLl;

                    if (cleanRouteLine && typeof turf !== 'undefined') {
                        try {
                            const runnerPt = turf.point([lon, lat]);
                            const snappedRunner = turf.nearestPointOnLine(cleanRouteLine, runnerPt);
                            const totalRouteKm = turf.length(cleanRouteLine, { units: 'kilometers' });
                            const coords = turf.getCoords(cleanRouteLine);
                            const startPt = turf.point(coords[0]);
                            const traveledSlice = turf.lineSlice(startPt, snappedRunner, cleanRouteLine);
                            globalRunnerTraveledKm = turf.length(traveledSlice, { units: 'kilometers' });
                        } catch (err) {
                            console.error("Route calculation error:", err);
                        }
                    }

                    renderPoints();
                    toggleLabels();
                } else if (!lastTrackerUpdateTime) {
                    lastTrackerUpdateTime = now;
                }

                let popupTitle = '';
                let statsHtml = '';

                if (cleanRouteLine && typeof turf !== 'undefined') {
                    try {
                        const runnerPt = turf.point([lon, lat]);
                        const snappedRunner = turf.nearestPointOnLine(cleanRouteLine, runnerPt);
                        const totalRouteKm = turf.length(cleanRouteLine, { units: 'kilometers' });
                        const coords = turf.getCoords(cleanRouteLine);
                        const startPt = turf.point(coords[0]);
                        const traveledSlice = turf.lineSlice(startPt, snappedRunner, cleanRouteLine);
                        const currentTraveledKm = turf.length(traveledSlice, { units: 'kilometers' });
                        const remainingKm = Math.max(0, totalRouteKm - currentTraveledKm);

                        popupTitle = `<b>${remainingKm.toFixed(2)} km to go!</b><br>`;

                        let closestUpcoming = null;
                        let minDistanceAlongRoute = Infinity;

                        parsedPoints.forEach(pt => {
                            const ptPt = turf.point([pt.lon, pt.lat]);
                            const snappedPt = turf.nearestPointOnLine(cleanRouteLine, ptPt);
                            const sliced = turf.lineSlice(snappedRunner, snappedPt, cleanRouteLine);
                            const distKm = turf.length(sliced, { units: 'kilometers' });

                            if (distKm > 0.05 && distKm < minDistanceAlongRoute) {
                                minDistanceAlongRoute = distKm;
                                closestUpcoming = {
                                    name: pt.name,
                                    distanceKm: distKm,
                                    timeStr: pt.timeStr,
                                    type: pt.type
                                };
                            }
                        });

                        if (closestUpcoming) {
                            let etaString = 'TBD';
                            let schedString = 'TBD';

                            if (closestUpcoming.timeStr) {
                                const schedHours = parseInt(closestUpcoming.timeStr.substring(0, 2), 10);
                                const schedMins = parseInt(closestUpcoming.timeStr.substring(2, 4), 10);
                                const schedTime = new Date(now);
                                schedTime.setHours(schedHours, schedMins, 0, 0);

                                const formattedTime = `${closestUpcoming.timeStr.substring(0, 2)}${closestUpcoming.timeStr.substring(2, 4)}`;
                                schedString = formattedTime;

                                let diffMins = Math.round((schedTime - now) / 60000);
                                etaString = diffMins >= 0 ? `${diffMins} mins (${formattedTime})` : `${Math.abs(diffMins)} mins ago (${formattedTime})`;

                                if (mostRecentSpeedKmPerMin > 0.01) {
                                    const liveRemMins = Math.round(closestUpcoming.distanceKm / mostRecentSpeedKmPerMin);
                                    const liveEtaDate = new Date(now.getTime() + liveRemMins * 60000);
                                    const liveEtaTimeStr = liveEtaDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }).replace(':', '');
                                    etaString = `${liveRemMins} mins (${liveEtaTimeStr})`;
                                }
                            }

                            statsHtml += `<b>Next:</b> ${closestUpcoming.name}, ${closestUpcoming.distanceKm.toFixed(2)} km<br>` +
                                         `<b>ETA:</b> ${etaString}<br>` +
                                         `<b>Scheduled:</b> ${schedString}<br>`;
                        }
                    } catch (err) {
                        console.error("Calculation error handled safely:", err);
                    }
                }

                const popupContent =
                    popupTitle +
                    statsHtml +
                    `<a href="${mapsUrl}" target="_blank" rel="noopener">📍 Open in Google Maps</a>`;

                if (!marker) {
                    const runnerIcon = L.divIcon({
                        className: 'racer-icon',
                        html: '🏃',
                        iconSize: [36, 36],
                        iconAnchor: [18, 18],
                        popupAnchor: [0, -18]
                    });
                    marker = L.marker([lat, lon], { icon: runnerIcon }).addTo(map);
                    marker.bindPopup(popupContent, { autoClose: false, closeOnClick: false, autoPan: false });
                    
                    marker.on('popupclose', () => { userClosedPopup = true; });
                    marker.on('popupopen', () => { userClosedPopup = false; });

                    marker.openPopup();
                    
                    map.setView([lat, lon], 14);
                    firstPositionReceived = true;
                } else {
                    marker.setLatLng([lat, lon]);
                    marker.getPopup().setContent(popupContent);
                    if (!marker.isPopupOpen() && !userClosedPopup) {
                        marker.openPopup();
                    }
                }

                const statusEl = document.getElementById('last-update');
                if (statusEl) {
                    const browserRefreshTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    const trackerTime = lastTrackerUpdateTime ? lastTrackerUpdateTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'Pending...';
                    
                    statusEl.innerHTML = 
                        `ETAs last updated: ${browserRefreshTime}<br>` +
                        `Tracker last updated: ${trackerTime}`;
                }
            } catch (error) {
                console.log('Error updating tracker:', error);
            }
        }

        loadPoints().then(() => {
            updateTracker();
            setInterval(updateTracker, 15000);
        });
    </script>
</body>
</html>
