<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 5535 Live Tracker</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100vw;
        }

        .info-box {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            max-width: 290px;
            font-size: 13px;
        }

        .info-box p {
            margin: 6px 0 0;
            color: #444;
        }

        /* Standalone "Last Updated" text overlay in bottom-left corner */
        .status-overlay {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #333;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            pointer-events: none;
        }

        .leaflet-popup-content a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }

        .leaflet-popup-content a:hover {
            text-decoration: underline;
        }

        .racer-icon {
            font-size: 30px;
            line-height: 36px;
            text-align: center;
            filter: drop-shadow(1px 2px 2px #555);
        }
    </style>
</head>

<body>
    <div class="info-box">
        <label style="display: block; margin-bottom: 8px;">
            <input type="checkbox" id="toggle-labels" onchange="toggleLabels()">
            Show Marker Labels
        </label>
        <div style="border-top: 1px solid #eee; padding-top: 8px;">
            <label for="timeOffset" style="display: block; font-size: 11px; margin-bottom: 3px; color: #666;">Time Offset (mins):</label>
            <div style="display: flex; gap: 4px; align-items: center;">
                <input type="number" id="timeOffset" value="0" onchange="applyTimeOffset()" style="width: 50px; padding: 3px; font-size: 12px;">
                <button onclick="applyTimeOffset()" style="padding: 3px 6px; font-size: 11px; cursor: pointer;">Apply</button>
                <button onclick="resetTimeOffset()" style="padding: 3px 6px; font-size: 11px; cursor: pointer;">Reset</button>
            </div>
        </div>
    </div>

    <!-- Standalone text overlay at bottom-left -->
    <div id="last-update" class="status-overlay">Tracking active...</div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>

    <script>
        // 1. Initialise base maps and layer switcher in bottom right.
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, swisstopo, and the GIS User Community'
        });

        const map = L.map('map', {
            center: [56.122185, -3.91031],
            zoom: 13,
            layers: [osmLayer] // Default view
        });

        const baseMaps = {
            "Street Map": osmLayer,
            "Satellite View": satelliteLayer
        };

        // Position layer control in the bottom right corner
        L.control.layers(baseMaps, null, { position: 'bottomright' }).addTo(map);

        let marker = null;
        let checkpointLayers = [];
        let cheerpointLayers = [];
        let rawCheckpointData = [];
        let rawCheerpointData = [];
        let firstPositionReceived = false;

        // 2. Load the KML route.
        omnivore.kml('route.kml')
            .on('ready', function () {
                this.setStyle({
                    color: '#2094f3',
                    weight: 5,
                    opacity: 0.8
                });

                if (!firstPositionReceived && this.getBounds().isValid()) {
                    map.fitBounds(this.getBounds());
                }
            })
            .on('error', function (error) {
                console.error('Could not load route.kml:', error);
            })
            .addTo(map);

        // Helper to parse HHMM string, add offset minutes, and return new HHMM string
        function adjustTimeString(timeStr, offsetMinutes) {
            let hours = parseInt(timeStr.substring(0, 2), 10);
            let mins = parseInt(timeStr.substring(2, 4), 10);
            
            let totalMinutes = (hours * 60) + mins + offsetMinutes;
            totalMinutes = (totalMinutes + 1440) % 1440; // Handle midnight crossover
            
            let newHours = Math.floor(totalMinutes / 60).toString().padStart(2, '0');
            let newMins = (totalMinutes % 60).toString().padStart(2, '0');
            
            return newHours + newMins;
        }

        // Render checkpoints taking current time offset into account
        function renderCheckpoints() {
            checkpointLayers.forEach(layer => map.removeLayer(layer));
            checkpointLayers = [];

            const offsetInput = document.getElementById('timeOffset');
            const offsetMinutes = offsetInput ? (parseInt(offsetInput.value) || 0) : 0;

            rawCheckpointData.forEach(cp => {
                const lat = Number(cp.la);
                const lon = Number(cp.lo);

                if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                    return;
                }

                let displayName = cp.n || 'Checkpoint';
                const match = displayName.match(/^(\d{4})(\s.*)$/);
                if (match) {
                    const originalTime = match[1];
                    const textDescription = match[2];
                    displayName = adjustTimeString(originalTime, offsetMinutes) + textDescription;
                }

                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;

                const checkpoint = L.circleMarker([lat, lon], {
                    radius: 6,
                    color: cp.c || '#f44034',
                    fillColor: cp.c || '#f44034',
                    fillOpacity: 0.8
                })
                .addTo(map)
                .bindPopup(
                    `<b>${displayName}</b><br>` +
                    `<a href="${mapsUrl}" target="_blank" rel="noopener">` +
                    `📍 Open in Google Maps</a>`
                )
                .bindTooltip(
                    `<b>${displayName}</b>`,
                    {
                        permanent: true,
                        direction: 'top',
                        offset: [0, -5]
                    }
                );

                checkpointLayers.push(checkpoint);
            });
        }

        // Render cheerpoints taking current time offset into account
        function renderCheerpoints() {
            cheerpointLayers.forEach(layer => map.removeLayer(layer));
            cheerpointLayers = [];

            const offsetInput = document.getElementById('timeOffset');
            const offsetMinutes = offsetInput ? (parseInt(offsetInput.value) || 0) : 0;

            rawCheerpointData.forEach(cp => {
                const lat = Number(cp.lat);
                const lon = Number(cp.lon);

                if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                    return;
                }

                let displayName = cp.name || 'Cheerpoint';
                const match = displayName.match(/^(\d{4})(\s.*)$/);
                if (match) {
                    const originalTime = match[1];
                    const textDescription = match[2];
                    displayName = adjustTimeString(originalTime, offsetMinutes) + textDescription;
                }

                const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                const cheerpoint = L.circleMarker([lat, lon], {
                    radius: 7,
                    color: '#9c27b0',
                    fillColor: '#ba68c8',
                    fillOpacity: 0.9
                })
                .addTo(map)
                .bindPopup(
                    `<b>${displayName}</b><br>` +
                    `${cp.note || ''}<br>` +
                    `<a href="${mapsUrl}" target="_blank" rel="noopener">` +
                    `📍 Open in Google Maps</a>`
                )
                .bindTooltip(
                    `<b>${displayName}</b>`,
                    {
                        permanent: true,
                        direction: 'bottom',
                        offset: [0, 5]
                    }
                );

                cheerpointLayers.push(cheerpoint);
            });
        }

        // Triggered when clicking "Apply" or changing the input
        function applyTimeOffset() {
            const offsetInput = document.getElementById('timeOffset');
            const offsetMinutes = offsetInput ? (parseInt(offsetInput.value) || 0) : 0;
            
            // Save offset to localStorage
            localStorage.setItem('checkpointTimeOffset', offsetMinutes);

            // Re-render both markers
            renderCheckpoints();
            renderCheerpoints();
            toggleLabels();
        }

        // Reset offset back to 0
        function resetTimeOffset() {
            const input = document.getElementById('timeOffset');
            if (input) {
                input.value = 0;
            }
            applyTimeOffset();
        }

        // 3. Load official checkpoints.
        async function loadCheckpoints() {
            try {
                const response = await fetch(
                    'checkpoints-p26.json?t=' + Date.now(),
                    { cache: 'no-store' }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const json = await response.json();

                if (json.success && Array.isArray(json.data)) {
                    rawCheckpointData = json.data;
                    
                    // Load saved offset from localStorage on startup if available
                    const savedOffset = localStorage.getItem('checkpointTimeOffset');
                    if (savedOffset !== null) {
                        const input = document.getElementById('timeOffset');
                        if (input) input.value = savedOffset;
                    }

                    renderCheckpoints();
                    toggleLabels();
                }
            } catch (error) {
                console.error('Error loading checkpoints:', error);
            }
        }

        // 4. Load optional manual cheerpoints.
        async function loadCheerpoints() {
            try {
                const response = await fetch(
                    'cheerpoints.json?t=' + Date.now(),
                    { cache: 'no-store' }
                );

                if (!response.ok) {
                    return;
                }

                const json = await response.json();

                if (json.success && Array.isArray(json.data)) {
                    rawCheerpointData = json.data;
                    renderCheerpoints();
                    toggleLabels();
                }
            } catch (error) {
                console.error('Error loading cheerpoints:', error);
            }
        }

        // 5. Toggle checkpoint and cheerpoint labels.
        function toggleLabels() {
            const checkbox = document.getElementById('toggle-labels');

            if (!checkbox) {
                return;
            }

            const show = checkbox.checked;

            [...checkpointLayers, ...cheerpointLayers].forEach(layer => {
                if (show) {
                    layer.openTooltip();
                } else {
                    layer.closeTooltip();
                }
            });
        }

        // 6. Fetch and display the latest racer position.
        async function updateTracker() {
            try {
                const response = await fetch(
                    'team5535_live.json?t=' + Date.now(),
                    { cache: 'no-store' }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const json = await response.json();

                if (
                    !json ||
                    json.success !== true ||
                    !json.data ||
                    typeof json.data.ll !== 'string'
                ) {
                    throw new Error(
                        'Unexpected tracking JSON structure or missing coordinates'
                    );
                }

                const teamData = json.data;
                const parts = teamData.ll.split(',').map(Number);

                if (
                    parts.length !== 2 ||
                    !Number.isFinite(parts[0]) ||
                    !Number.isFinite(parts[1]) ||
                    Math.abs(parts[0]) > 90 ||
                    Math.abs(parts[1]) > 180
                ) {
                    throw new Error(
                        'Invalid latitude/longitude: ' + teamData.ll
                    );
                }

                const lat = parts[0];
                const lon = parts[1];
                const name = teamData.n || 'Team 5535';
                const raceNumber = teamData.r || 5535;

                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;

                const popupContent =
                    `<b>${name} (#${raceNumber})</b><br>` +
                    `Lat/Lon: ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>` +
                    `<a href="${mapsUrl}" target="_blank" rel="noopener">` +
                    `📍 Open in Google Maps</a>`;

                const timeString = new Date().toLocaleTimeString();
                console.log(`[${timeString}] Team ${raceNumber} coordinates: ${lat}, ${lon}`);

                // Update bottom-left status overlay
                const lastUpdateEl = document.getElementById('last-update');
                if (lastUpdateEl) {
                    lastUpdateEl.innerText = `Last updated: ${timeString}`;
                }

                if (marker) {
                    marker.setLatLng([lat, lon]);
                    marker.setPopupContent(popupContent);
                } else {
                    marker = L.marker([lat, lon], {
                        icon: L.divIcon({
                            className: '',
                            html: '<div class="racer-icon">🏃</div>',
                            iconSize: [36, 36],
                            iconAnchor: [18, 18],
                            popupAnchor: [0, -18]
                        }),
                        zIndexOffset: 1000
                    })
                    .addTo(map)
                    .bindPopup(popupContent);

                    firstPositionReceived = true;
                    map.setView([lat, lon], 15);
                }

            } catch (error) {
                console.error('Error updating racer marker:', error);
                const lastUpdateEl = document.getElementById('last-update');
                if (lastUpdateEl) {
                    lastUpdateEl.innerText = `Update failed (${new Date().toLocaleTimeString()})`;
                }
            }
        }

        // Allow tapping the map to close open popups.
        map.on('click', function () {
            map.closePopup();
        });

        // 7. Start everything up.
        loadCheckpoints();
        loadCheerpoints();

        updateTracker();
        setInterval(updateTracker, 30000);
    </script>
</body>
</html>
