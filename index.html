<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 5535 Live Tracker</title>

    <!-- Inline Runner Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏃‍♂️</text></svg>">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100vh;
            width: 100vw;
        }

        /* Mobile-friendly time offset input */
        .offset-input {
            width: 38px;
            padding: 2px 4px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            outline: none;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        /* Light Yellow for positive offsets */
        .offset-input.offset-pos {
            background-color: #fffde7;
            color: #f57f17;
            border-color: #fff59d;
        }

        /* Light Green for negative offsets */
        .offset-input.offset-neg {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-color: #c8e6c9;
        }

        /* Compact, mobile-friendly Centered Bottom Panel */
        .bottom-panel {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 5px;
            white-space: nowrap;
            max-width: 95vw;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #333;
            font-size: 12px;
        }

        .controls-row label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            user-select: none;
        }

        .controls-row input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .status-row {
            font-size: 11px;
            color: #555;
            text-align: center;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            padding-top: 4px;
            line-height: 1.2;
        }

        .leaflet-popup-content a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }

        .leaflet-popup-content a:hover {
            text-decoration: underline;
        }

        .racer-icon {
            font-size: 30px;
            line-height: 36px;
            text-align: center;
            filter: drop-shadow(1px 2px 2px #555);
        }

        /* Flip the Leaflet marker wrapper horizontally when moving right */
        .leaflet-marker-icon.flip-right {
            transform: scaleX(-1) !important;
        }

        /* Slim vertical separator between controls */
        .divider {
            width: 1px;
            height: 14px;
            background-color: #ccc;
        }
    </style>
</head>

<body>
    <!-- Compact, mobile-friendly Bottom Panel -->
    <div class="bottom-panel">
        <div class="controls-row">
            <label>
                <input type="checkbox" id="toggle-labels" onchange="toggleLabels()">
                Show Labels
            </label>

            <div class="divider"></div>

            <label for="timeOffset">
                Time Offset:
                <input type="number" id="timeOffset" value="0" oninput="applyTimeOffset()" class="offset-input">
            </label>
        </div>

        <div id="last-update" class="status-row">Tracking active...</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    <!-- Turf.js for route distance calculations -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        // Dynamic background styling for offset box
        function updateOffsetStyle() {
            const input = document.getElementById('timeOffset');
            if (!input) return;
            const val = parseInt(input.value, 10) || 0;

            input.classList.remove('offset-pos', 'offset-neg');
            if (val > 0) {
                input.classList.add('offset-pos');
            } else if (val < 0) {
                input.classList.add('offset-neg');
            }
        }

        // 1. Initialise base maps and layer switcher with persistence.
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, swisstopo, and the GIS User Community'
        });

        const savedLayerName = localStorage.getItem('selectedMapLayer');
        const initialLayer = (savedLayerName === 'Satellite View') ? satelliteLayer : osmLayer;

        const map = L.map('map', {
            center: [56.122185, -3.91031],
            zoom: 13,
            layers: [initialLayer]
        });

        const baseMaps = {
            "Street Map": osmLayer,
            "Satellite View": satelliteLayer
        };

        L.control.layers(baseMaps, null, { position: 'topleft' }).addTo(map);

        map.on('baselayerchange', function (e) {
            localStorage.setItem('selectedMapLayer', e.name);
        });

        let marker = null;
        let pointLayers = [];
        let rawPointsData = [];
        let parsedPoints = [];
        let firstPositionReceived = false;
        let cleanRouteLine = null;

        let lastKnownCoords = null;
        let globalRunnerTraveledKm = 0;
        let userClosedPopup = false;
        let lastTrackerUpdateTime = null;
        let currentGlobalSpeedKmPerMin = 0;
        let lastKnownMovingSpeedKmPerMin = 4.0 / 60; // Default fallback speed (~4 km/h) if stopped at start
        let currentRunnerDistFromStart = 0;

        function extractLineString(geoJson) {
            try {
                let coords = [];
                turf.coordEach(geoJson, function (currentCoord) {
                    coords.push(currentCoord);
                });
                if (coords.length >= 2) {
                    return turf.lineString(coords);
                }
            } catch (err) {
                console.error("Error processing KML coordinates for Turf:", err);
            }
            return null;
        }

        omnivore.kml('route.kml')
            .on('ready', function () {
                this.setStyle({
                    color: '#2094f3',
                    weight: 5,
                    opacity: 0.8
                });

                if (!firstPositionReceived && this.getBounds().isValid()) {
                    map.fitBounds(this.getBounds());
                }

                cleanRouteLine = extractLineString(this.toGeoJSON());
            })
            .on('error', function (error) {
                console.error('Could not load route.kml:', error);
            })
            .addTo(map);

        function adjustTimeString(timeStr, offsetMinutes) {
            let hours = parseInt(timeStr.substring(0, 2), 10);
            let mins = parseInt(timeStr.substring(2, 4), 10);
            
            let totalMinutes = (hours * 60) + mins + offsetMinutes;
            totalMinutes = (totalMinutes + 1440) % 1440;
            
            let newHours = Math.floor(totalMinutes / 60).toString().padStart(2, '0');
            let newMins = (totalMinutes % 60).toString().padStart(2, '0');
            
            return newHours + newMins;
        }

        function renderPoints() {
            pointLayers.forEach(layer => map.removeLayer(layer));
            pointLayers = [];
            parsedPoints = [];

            const offsetInput = document.getElementById('timeOffset');
            const offsetMinutes = offsetInput ? (parseInt(offsetInput.value) || 0) : 0;

            // Load locked targets from localStorage
            let lockedTargets = {};
            try {
                lockedTargets = JSON.parse(localStorage.getItem('lockedPassedTargets') || '{}');
            } catch (e) {
                lockedTargets = {};
            }

            // Get start point for route calculations if available
            let startPt = null;
            if (cleanRouteLine && typeof turf !== 'undefined') {
                const coords = turf.getCoords(cleanRouteLine);
                if (coords.length > 0) startPt = turf.point(coords[0]);
            }

            rawPointsData.forEach((pt, index) => {
                const lat = Number(pt.la);
                const lon = Number(pt.lo);

                if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                    return;
                }

                let displayName = pt.n || 'Point';
                let originalTimeStr = null;
                const match = displayName.match(/^(\d{4})(\s.*)$/);
                
                if (match) {
                    originalTimeStr = match[1];
                }

                let targetTimeStr = null;
                let cleanLocationName = displayName;
                
                // Exception: Check if this is the final point in points.json (the finish line)
                const isFinalPoint = (index === rawPointsData.length - 1);

                if (match) {
                    const originalTime = match[1];
                    const textDescription = match[2];
                    cleanLocationName = textDescription.trim();

                    // Check if this point has already been passed by the runner (Skip for final finish point)
                    let isPassed = false;
                    if (!isFinalPoint && cleanRouteLine && startPt && currentRunnerDistFromStart > 0 && typeof turf !== 'undefined') {
                        try {
                            const ptPt = turf.point([lon, lat]);
                            const snappedPt = turf.nearestPointOnLine(cleanRouteLine, ptPt);
                            const ptSlice = turf.lineSlice(startPt, snappedPt, cleanRouteLine);
                            const ptDistFromStart = turf.length(ptSlice, { units: 'kilometers' });

                            // If runner has progressed past this point (+50m buffer)
                            if (currentRunnerDistFromStart >= ptDistFromStart + 0.05) {
                                isPassed = true;
                            }
                        } catch (err) {
                            console.error("Passed check error:", err);
                        }
                    }

                    if (isPassed) {
                        // If already locked in storage, use it. Otherwise lock it with current offset
                        if (lockedTargets[cleanLocationName]) {
                            targetTimeStr = lockedTargets[cleanLocationName];
                        } else {
                            targetTimeStr = adjustTimeString(originalTime, offsetMinutes);
                            lockedTargets[cleanLocationName] = targetTimeStr;
                            localStorage.setItem('lockedPassedTargets', JSON.stringify(lockedTargets));
                        }
                    } else {
                        // Not passed yet (or it's the final finish point), calculate dynamically based on offset slider
                        targetTimeStr = adjustTimeString(originalTime, offsetMinutes);
                    }

                    displayName = targetTimeStr + textDescription;
                } else {
                    cleanLocationName = displayName;
                }

                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                const isCheckpoint = pt.point_type === 'checkpoint';

                let etaDisplay = 'TBD';
                let schedDisplay = 'TBD';

                if (targetTimeStr) {
                    const schedHours = parseInt(targetTimeStr.substring(0, 2), 10);
                    const schedMins = parseInt(targetTimeStr.substring(2, 4), 10);
                    const now = new Date();
                    const schedTime = new Date(now);
                    schedTime.setHours(schedHours, schedMins, 0, 0);

                    const formattedSchedTime = `${targetTimeStr.substring(0, 2)}${targetTimeStr.substring(2, 4)}`;
                    schedDisplay = formattedSchedTime;

                    const effectiveSpeed = currentGlobalSpeedKmPerMin > 0.001 ? currentGlobalSpeedKmPerMin : lastKnownMovingSpeedKmPerMin;

                    if (!isFinalPoint && cleanRouteLine && effectiveSpeed > 0.001 && currentRunnerDistFromStart > 0 && startPt && typeof turf !== 'undefined') {
                        try {
                            const ptPt = turf.point([lon, lat]);
                            const snappedPt = turf.nearestPointOnLine(cleanRouteLine, ptPt);
                            const ptSlice = turf.lineSlice(startPt, snappedPt, cleanRouteLine);
                            const ptDistFromStart = turf.length(ptSlice, { units: 'kilometers' });

                            const remainingDistKm = ptDistFromStart - currentRunnerDistFromStart;

                            if (remainingDistKm > 0) {
                                const liveRemMins = Math.round(remainingDistKm / effectiveSpeed);
                                const liveEtaDate = new Date(now.getTime() + liveRemMins * 60000);
                                const liveEtaTimeStr = liveEtaDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }).replace(':', '');
                                etaDisplay = `${liveRemMins} mins (${liveEtaTimeStr})`;
                            } else {
                                etaDisplay = 'Passed';
                            }
                        } catch (e) {
                            let diffMins = Math.round((schedTime - now) / 60000);
                            etaDisplay = diffMins >= 0 ? `${diffMins} mins (${formattedSchedTime})` : `${Math.abs(diffMins)} mins ago (${formattedSchedTime})`;
                        }
                    } else if (isFinalPoint && cleanRouteLine && effectiveSpeed > 0.001 && currentRunnerDistFromStart > 0 && startPt && typeof turf !== 'undefined') {
                        try {
                            const totalRouteKm = turf.length(cleanRouteLine, { units: 'kilometers' });
                            const remainingDistKm = Math.max(0, totalRouteKm - currentRunnerDistFromStart);
                            if (remainingDistKm > 0) {
                                const liveRemMins = Math.round(remainingDistKm / effectiveSpeed);
                                const liveEtaDate = new Date(now.getTime() + liveRemMins * 60000);
                                const liveEtaTimeStr = liveEtaDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }).replace(':', '');
                                etaDisplay = `${liveRemMins} mins (${liveEtaTimeStr})`;
                            } else {
                                etaDisplay = 'Passed';
                            }
                        } catch (e) {
                            let diffMins = Math.round((schedTime - now) / 60000);
                            etaDisplay = diffMins >= 0 ? `${diffMins} mins (${formattedSchedTime})` : `${Math.abs(diffMins)} mins ago (${formattedSchedTime})`;
                        }
                    } else {
                        let diffMins = Math.round((schedTime - now) / 60000);
                        etaDisplay = diffMins >= 0 ? `${diffMins} mins (${formattedSchedTime})` : `${Math.abs(diffMins)} mins ago (${formattedSchedTime})`;
                    }
                }

                const popupHtml =
                    `<b>${cleanLocationName}</b><br>` +
                    `ETA: ${etaDisplay}<br>` +
                    `Your target: ${schedDisplay}<br>` +
                    `<a href="${mapsUrl}" target="_blank" rel="noopener">🗺️ Open in Google Maps</a>`;

                const pointMarker = L.circleMarker([lat, lon], {
                    radius: isCheckpoint ? 12 : 10,
                    weight: 2,
                    color: pt.c || (isCheckpoint ? '#d32f2f' : '#7b1fa2'),
                    fillColor: pt.c || (isCheckpoint ? '#f44034' : '#ba68c8'),
                    fillOpacity: isCheckpoint ? 0.9 : 0.85
                })
                .addTo(map)
                .bindPopup(popupHtml)
                .bindTooltip(
                    `<b>${displayName}</b>`,
                    {
                        permanent: true,
                        direction: isCheckpoint ? 'top' : 'bottom',
                        offset: isCheckpoint ? [0, -8] : [0, 8]
                    }
                );

                pointLayers.push(pointMarker);
                parsedPoints.push({ lat, lon, name: cleanLocationName, timeStr: targetTimeStr, type: pt.point_type });
            });
        }

        function applyTimeOffset() {
            const offsetInput = document.getElementById('timeOffset');
            const offsetVal = offsetInput ? (parseInt(offsetInput.value) || 0) : 0;
            
            localStorage.setItem('checkpointTimeOffset', offsetVal);

            updateOffsetStyle();
            renderPoints();
            toggleLabels();

            if (marker) updateTracker();
        }

        async function loadPoints() {
            try {
                const response = await fetch('points.json?t=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();

                if (json.success && Array.isArray(json.data)) {
                    rawPointsData = json.data;
                    
                    const savedOffset = localStorage.getItem('checkpointTimeOffset');
                    if (savedOffset !== null) {
                        const input = document.getElementById('timeOffset');
                        if (input) input.value = savedOffset;
                    }

                    updateOffsetStyle();
                    renderPoints();
                    toggleLabels();
                }
            } catch (error) {
                console.error('Error loading points:', error);
            }
        }

        function toggleLabels() {
            const checkbox = document.getElementById('toggle-labels');
            if (!checkbox) return;
            const show = checkbox.checked;
            pointLayers.forEach(layer => {
                if (show) layer.openTooltip();
                else layer.closeTooltip();
            });
        }

        async function updateTracker() {
            try {
                const response = await fetch('team5535_live.json?t=' + Date.now(), { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const json = await response.json();

                if (!json || json.success !== true || !json.data || typeof json.data.ll !== 'string') {
                    throw new Error('Unexpected tracking JSON structure');
                }

                const rawLl = json.data.ll;
                const parts = rawLl.split(',').map(Number);
                if (parts.length !== 2 || !Number.isFinite(parts[0]) || !Number.isFinite(parts[1])) {
                    throw new Error('Invalid coordinates');
                }

                const lat = parts[0];
                const lon = parts[1];
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
                const now = new Date();

                // Read speed directly from JSON (e.g., "2.90" kph)
                const reportedSpeedKphRaw = json.data.sp;
                const reportedSpeedKph = parseFloat(reportedSpeedKphRaw);
                currentGlobalSpeedKmPerMin = (Number.isFinite(reportedSpeedKph) && reportedSpeedKph > 0) ? (reportedSpeedKph / 60) : 0;
                
                // Track last known non-zero speed for fallback when they stop
                if (currentGlobalSpeedKmPerMin > 0.001) {
                    lastKnownMovingSpeedKmPerMin = currentGlobalSpeedKmPerMin;
                }

                // Choose speed to use: current speed if moving, otherwise last known moving speed
                const effectiveSpeedKmPerMin = currentGlobalSpeedKmPerMin > 0.001 ? currentGlobalSpeedKmPerMin : lastKnownMovingSpeedKmPerMin;

                const speedDisplay = reportedSpeedKphRaw ? `${reportedSpeedKphRaw} km/h` : 'N/A';

                // Determine movement direction (longitude change)
                let isMovingRight = false;
                if (lastKnownCoords) {
                    const prevLon = parseFloat(lastKnownCoords.split(',')[1]);
                    if (lon > prevLon) {
                        isMovingRight = true;
                    } else if (lon < prevLon) {
                        isMovingRight = false;
                    }
                }

                const coordsChanged = (rawLl !== lastKnownCoords);
                if (coordsChanged) {
                    lastTrackerUpdateTime = now;
                    lastKnownCoords = rawLl;
                } else if (!lastTrackerUpdateTime) {
                    lastTrackerUpdateTime = now;
                }

                // Check if the runner has finished by inspecting the splits for a finish entry with a valid finish time
                let finishTimeStr = null;
                let raceTimeStr = null;
                if (json.data.splits && Array.isArray(json.data.splits)) {
                    const finishSplit = json.data.splits.slice().reverse().find(s => s.t && (s.ct === 'finish' || (s.n && s.n.toLowerCase().includes('finish'))));
                    if (finishSplit) {
                        const rawTime = finishSplit.t;
                        const timeMatch = rawTime.match(/(\d{2}:\d{2}:\d{2})/);
                        if (timeMatch) {
                            finishTimeStr = timeMatch[1];
                        } else {
                            finishTimeStr = rawTime.replace(/^[A-Za-z]+\s+/, '');
                        }
                    }
                }
                if (json.data.details && json.data.details["Time Taken"]) {
                    raceTimeStr = json.data.details["Time Taken"];
                } else if (json.data.t) {
                    raceTimeStr = json.data.t;
                }

                let popupTitle = '';
                let statsHtml = '';

                if (finishTimeStr) {
                    // Runner has finished! Show finish details without speed
                    popupTitle = `<b>Finished at ${finishTimeStr}</b><br>` +
                                 `Race time: ${raceTimeStr || 'N/A'}<br>`;
                } else {
                    // Runner is still racing: compute distance, upcoming checkpoint, ETA, speed, and target
                    if (cleanRouteLine && typeof turf !== 'undefined') {
                        try {
                            const runnerPt = turf.point([lon, lat]);
                            const snappedRunner = turf.nearestPointOnLine(cleanRouteLine, runnerPt);
                            const totalRouteKm = turf.length(cleanRouteLine, { units: 'kilometers' });
                            const coords = turf.getCoords(cleanRouteLine);
                            const startPt = turf.point(coords[0]);
                            const traveledSlice = turf.lineSlice(startPt, snappedRunner, cleanRouteLine);
                            currentRunnerDistFromStart = turf.length(traveledSlice, { units: 'kilometers' });
                            const remainingKm = Math.max(0, totalRouteKm - currentRunnerDistFromStart);

                            popupTitle = `<b>${remainingKm.toFixed(2)} km to go!</b><br>`;

                            let closestUpcoming = null;

                            for (const pt of parsedPoints) {
                                const ptPt = turf.point([pt.lon, pt.lat]);
                                const snappedPt = turf.nearestPointOnLine(cleanRouteLine, ptPt);
                                const ptSlice = turf.lineSlice(startPt, snappedPt, cleanRouteLine);
                                const ptDistFromStart = turf.length(ptSlice, { units: 'kilometers' });

                                const distKm = ptDistFromStart - currentRunnerDistFromStart;

                                if (distKm > 0) {
                                    closestUpcoming = {
                                        name: pt.name,
                                        distanceKm: distKm,
                                        timeStr: pt.timeStr,
                                        type: pt.type
                                    };
                                    break;
                                }
                            }

                            // FALLBACK: If all intermediate checkpoints have been passed, use the final point with the actual remaining distance
                            if (!closestUpcoming && parsedPoints.length > 0) {
                                const lastPt = parsedPoints[parsedPoints.length - 1];
                                closestUpcoming = {
                                    name: lastPt.name,
                                    distanceKm: remainingKm,
                                    timeStr: lastPt.timeStr,
                                    type: lastPt.type
                                };
                            }

                            if (closestUpcoming) {
                                let etaString = 'TBD';
                                let schedString = 'TBD';

                                if (closestUpcoming.timeStr) {
                                    const schedHours = parseInt(closestUpcoming.timeStr.substring(0, 2), 10);
                                    const schedMins = parseInt(closestUpcoming.timeStr.substring(2, 4), 10);
                                    const schedTime = new Date(now);
                                    schedTime.setHours(schedHours, schedMins, 0, 0);

                                    const formattedTime = `${closestUpcoming.timeStr.substring(0, 2)}${closestUpcoming.timeStr.substring(2, 4)}`;
                                    schedString = formattedTime;

                                    let diffMins = Math.round((schedTime - now) / 60000);
                                    etaString = diffMins >= 0 ? `${diffMins} mins (${formattedTime})` : `${Math.abs(diffMins)} mins ago (${formattedTime})`;

                                    if (effectiveSpeedKmPerMin > 0.001) {
                                        const liveRemMins = Math.round(closestUpcoming.distanceKm / effectiveSpeedKmPerMin);
                                        const liveEtaDate = new Date(now.getTime() + liveRemMins * 60000);
                                        const liveEtaTimeStr = liveEtaDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }).replace(':', '');
                                        etaString = `${liveRemMins} mins (${liveEtaTimeStr})`;
                                    }
                                }

                                statsHtml = `<b>Next:</b> ${closestUpcoming.name}, ${closestUpcoming.distanceKm.toFixed(2)} km<br>` +
                                             `<b>ETA:</b> ${etaString}<br>` +
                                             `<b>Speed:</b> ${speedDisplay}<br>` +
                                             `<i>Your target: ${schedString}</i><br>`;
                            } else {
                                statsHtml = `<b>Speed:</b> ${speedDisplay}<br>`;
                            }
                        } catch (err) {
                            console.error("Calculation error handled safely:", err);
                        }
                    }
                }

                // Re-render points using the effective speed and locked past targets
                renderPoints();
                toggleLabels();

                const popupContent =
                    popupTitle +
                    statsHtml +
                    `<a href="${mapsUrl}" target="_blank" rel="noopener">🗺️ Open in Google Maps</a>`;

                if (!marker) {
                    const runnerIcon = L.divIcon({
                        className: 'racer-icon',
                        html: '🏃‍♂️',
                        iconSize: [36, 36],
                        iconAnchor: [18, 18],
                        popupAnchor: [0, -18]
                    });
                    marker = L.marker([lat, lon], { icon: runnerIcon }).addTo(map);
                    marker.bindPopup(popupContent, { autoClose: false, closeOnClick: false, autoPan: false });
                    
                    marker.on('popupclose', () => { userClosedPopup = true; });
                    marker.on('popupopen', () => { userClosedPopup = false; });

                    marker.openPopup();
                    map.setView([lat, lon], 14);
                    firstPositionReceived = true;
                } else {
                    marker.setLatLng([lat, lon]);
                    marker.getPopup().setContent(popupContent);

                    // Update Leaflet marker wrapper element class for direction
                    const iconEl = marker.getElement();
                    if (iconEl) {
                        if (isMovingRight) {
                            iconEl.classList.add('flip-right');
                        } else {
                            iconEl.classList.remove('flip-right');
                        }
                    }

                    if (!marker.isPopupOpen() && !userClosedPopup) {
                        marker.openPopup();
                    }
                }

                const statusEl = document.getElementById('last-update');
                if (statusEl) {
                    const browserRefreshTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    const trackerTime = lastTrackerUpdateTime ? lastTrackerUpdateTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'Pending...';
                    
                    statusEl.innerHTML = `Last updated... ETAs ${browserRefreshTime} &nbsp;|&nbsp; Tracker ${trackerTime}`;
                }
            } catch (error) {
                console.log('Error updating tracker:', error);
            }
        }

        loadPoints().then(() => {
            updateTracker();
            setInterval(updateTracker, 15000);
        });
    </script>
</body>
</html>
