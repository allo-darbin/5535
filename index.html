<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 5535 Live Tracker</title>
    <!-- Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: white; padding: 12px 18px; border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-width: 260px;
        }
        .info-box h3 { margin: 0 0 5px 0; font-size: 16px; color: #1a73e8; }
        .info-box p { margin: 3px 0; font-size: 13px; color: #444; }
    </style>
</head>
<body>

    <!-- Floating Info Panel -->
    <div class="info-box">
        <h3 id="team-name">Team 5535: Connecting...</h3>
        <p id="team-status">Polling worker every 30s...</p>
        <p id="team-coords">Coordinates: --</p>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Omnivore CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    
    <script>
        // 1. Initialize Map
        const map = L.map('map').setView([56.122, -3.910], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let marker = null;

        // 2. Load the KML route file from your repository
        const routeLayer = omnivore.kml('route.kml')
            .on('ready', function() {
                this.setStyle({ color: '#2094f3', weight: 5, opacity: 0.8 });
                map.fitBounds(this.getBounds());
            })
            .addTo(map);

        // 3. Function to fetch live JSON via your Cloudflare Worker every 30 seconds
        async function updateTracker() {
            try {
                const workerUrl = 'https://race-proxy.stuart-28b.workers.dev/';
                
                const response = await fetch(workerUrl);
                const json = await response.json();

                let foundTeam = null;

                // Robust recursive or flat search to handle OpenTracking's exact JSON layout
                function searchTeams(obj) {
                    if (!obj) return;
                    if (Array.isArray(obj)) {
                        for (let item of obj) {
                            searchTeams(item);
                        }
                    } else if (typeof obj === 'object') {
                        // Check if this object represents team 5535
                        if (obj.r == 5535 || obj.bib == 5535) {
                            foundTeam = obj;
                            return;
                        }
                        // Otherwise, loop through its properties
                        for (let key in obj) {
                            if (obj.hasOwnProperty(key)) {
                                searchTeams(obj[key]);
                            }
                        }
                    }
                }

                searchTeams(json);

                if (foundTeam && foundTeam.ll) {
                    const [lat, lon] = foundTeam.ll.split(',').map(Number);

                    document.getElementById('team-name').innerText = `${foundTeam.n || 'Team 5535'} (#5535)`;
                    document.getElementById('team-status').innerText = `Status: Live (30s polling)`;
                    document.getElementById('team-coords').innerText = `Lat/Lon: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;

                    if (marker) {
                        marker.setLatLng([lat, lon]);
                    } else {
                        marker = L.marker([lat, lon]).addTo(map)
                            .bindPopup(`<b>${foundTeam.n || 'Team 5535'}</b><br>Team 5535`)
                            .openPopup();
                    }
                } else {
                    document.getElementById('team-status').innerText = "Team 5535 data parsing...";
                }
            } catch (error) {
                console.error("Error fetching live data via worker:", error);
                document.getElementById('team-status').innerText = "Connection error. Retrying in 30s...";
            }
        }

        // Run immediately on load, then repeat every 30 seconds like clockwork
        updateTracker();
        setInterval(updateTracker, 30000);
    </script>
</body>
</html>
